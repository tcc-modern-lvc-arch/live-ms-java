quarkus.application.name=live-ms-quarkus-poc

# Polling (Quarkus @Scheduled "every" takes a duration: 30s, PT30S, 5m ... not bare millis)
ais.polling.interval=30s

# AIS REST client (Spring: AisFeignClient url + openfeign default timeouts 5s/10s)
quarkus.rest-client.ais-api.url=https://www.aisfriends.com
quarkus.rest-client.ais-api.connect-timeout=5000
quarkus.rest-client.ais-api.read-timeout=10000

# Event Hub gRPC client (Spring: event-hub.grpc.*)
quarkus.grpc.clients.event-hub.host=localhost
quarkus.grpc.clients.event-hub.port=50051
quarkus.grpc.clients.event-hub.plain-text=true
quarkus.grpc.clients.event-hub.keep-alive-time=30s
quarkus.grpc.clients.event-hub.keep-alive-timeout=10s
event-hub.grpc.area-id=default-area

# proto-shared jar ships .proto files + pre-generated stubs: do not run codegen on them
quarkus.grpc.codegen.skip=true

quarkus.log.category."io.github.raphonzius.lvc".level=DEBUG
%test.ais.polling.interval=1h
