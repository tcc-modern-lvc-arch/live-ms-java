services:
  live-adapter:
    build:
      context: ..
      dockerfile: live-ms-java/Dockerfile
    container_name: live-adapter
    environment:
      - SPRING_CLOUD_VAULT_HOST=shared-vault
      - EVENT_HUB_GRPC_HOST=event-hub
    ports:
      - "8080:8080"
    networks:
      - shared-infra-network

networks:
  shared-infra-network:
    external: true
