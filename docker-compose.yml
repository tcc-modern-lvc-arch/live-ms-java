version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: live-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - live-network

  live-adapter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live-adapter
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - live-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/vessels/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:

networks:
  live-network:
    driver: bridge

