services:
  live-adapter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live-adapter
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: shared-redis
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - shared-infra-network

networks:
  shared-infra-network:
    external: true
