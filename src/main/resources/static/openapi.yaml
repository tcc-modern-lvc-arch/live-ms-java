openapi: "3.1.0"
info:
  title: OlhoVivo Bus Reader
  description: Reads SPTrans OlhoVivo bus positions and persists polling snapshots in PostgreSQL.
  version: "1.0"

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Buses
    description: SPTrans OlhoVivo bus lines and vehicle positions

paths:
  /api/buses/lines:
    get:
      tags: [Buses]
      summary: Search bus lines
      operationId: searchLines
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: q
          in: query
          required: true
          description: Line number or partial name
          schema:
            type: string
      responses:
        "200":
          description: Matching lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineData"

  /api/buses/positions/line:
    get:
      tags: [Buses]
      summary: Get vehicle positions for a line
      operationId: positionsByLine
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: codigoLinha
          in: query
          required: true
          description: OlhoVivo line code
          schema:
            type: integer
      responses:
        "200":
          description: Current vehicle positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionResponse"

  /api/buses/poll:
    post:
      tags: [Buses]
      summary: Poll configured lines and persist vehicle positions
      operationId: manualPollBuses
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "202":
          description: Poll completed
          content:
            text/plain:
              schema:
                type: string

  /api/buses/health:
    get:
      tags: [Buses]
      summary: Bus service health
      operationId: busHealth
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string

components:
  parameters:
    ApiVersion:
      name: X-API-Version
      in: header
      required: false
      description: API version; defaults to 1.0.
      schema:
        type: string
        default: "1.0"
        enum: ["1.0"]
  schemas:
    LineData:
      type: object
      properties:
        cl:
          type: integer
          description: OlhoVivo line code
        lc:
          type: boolean
          description: Whether the line is circular
        lt:
          type: string
          description: Line sign
        sl:
          type: integer
          description: Direction
        tl:
          type: integer
          description: Operation mode
        tp:
          type: string
          description: Main-to-secondary sign
        ts:
          type: string
          description: Secondary-to-main sign
    VehicleData:
      type: object
      properties:
        p:
          type: integer
          description: Vehicle prefix
        a:
          type: boolean
          description: Accessibility
        ta:
          type: string
          description: Position capture timestamp
        py:
          type: number
          format: double
          description: Latitude
        px:
          type: number
          format: double
          description: Longitude
    LinePosition:
      type: object
      properties:
        c:
          type: string
        cl:
          type: integer
        sl:
          type: integer
        lt0:
          type: string
        lt1:
          type: string
        qv:
          type: integer
        vs:
          type: array
          items:
            $ref: "#/components/schemas/VehicleData"
    PositionResponse:
      type: object
      properties:
        hr:
          type: string
          description: Snapshot reference time
        l:
          type: array
          items:
            $ref: "#/components/schemas/LinePosition"
        vs:
          type: array
          items:
            $ref: "#/components/schemas/VehicleData"
