openapi: "3.1.0"
info:
  title: LVC Live Adapter
  description: |
    Real-time maritime and urban transit data adapter.
    Polls the AIS API for vessel positions and the SPTrans OlhoVivo API for
    São Paulo bus positions, then streams results to Event Hub via gRPC.
  version: "1.0"
  contact:
    name: Rafael Pereira

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Vessels
    description: AIS maritime vessel real-time positions (Brazil coast)
  - name: Buses
    description: SPTrans OlhoVivo real-time bus positions (São Paulo)
  - name: Floodings
    description: CGESP flooding points (São Paulo — scraped HTML, may be intermittently unavailable)

# --------------------------------------------------------------------------- #
# API Versioning: send X-API-Version header to pin a version (defaults to 1.0)#
# --------------------------------------------------------------------------- #

paths:

  # ---------------------------------------------------------------------------
  # Vessels
  # ---------------------------------------------------------------------------

  /api/vessels/bounding-box:
    get:
      tags: [Vessels]
      summary: Vessels in a bounding box
      description: |
        Returns all AIS-tracked vessels currently inside the given lat/long
        bounding box. Defaults to the Brazilian south-east coast.
      operationId: getVessels
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: lonMin
          in: query
          description: Minimum longitude
          schema: { type: number, format: double, default: -49.0 }
        - name: latMin
          in: query
          description: Minimum latitude
          schema: { type: number, format: double, default: -28.5 }
        - name: lonMax
          in: query
          description: Maximum longitude
          schema: { type: number, format: double, default: -35.0 }
        - name: latMax
          in: query
          description: Maximum latitude
          schema: { type: number, format: double, default: -22.5 }
        - name: zoom
          in: query
          description: Zoom level for the AIS query
          schema: { type: integer, default: 6 }
      responses:
        "200":
          description: Vessel list returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VesselData"

  /api/vessels/poll:
    post:
      tags: [Vessels]
      summary: Trigger manual AIS poll
      description: |
        Immediately fetches vessel positions from the AIS API and publishes
        them to Event Hub via gRPC.
      operationId: manualPollVessels
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "202":
          description: Poll accepted and initiated
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/VesselPollAck"

  /api/vessels/health:
    get:
      tags: [Vessels]
      summary: Vessel service health
      operationId: vesselHealth
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/VesselHealthStatus"

  # ---------------------------------------------------------------------------
  # Floodings
  # ---------------------------------------------------------------------------

  /api/floodings:
    get:
      tags: [Floodings]
      summary: Flooding points for a date
      description: |
        Returns all flooding points scraped from CGESP for the given date.
        Defaults to today in the São Paulo timezone when `date` is omitted.

        **Circuit breaker:** if CGESP is unreachable the response will be an
        empty array (fallback). Retried up to 3× with exponential backoff
        (500 ms → 1 s → 2 s) before the circuit opens.
      operationId: getFloodings
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: date
          in: query
          required: false
          description: "Date to query in DD/MM/YYYY format (defaults to today SP time)"
          schema: { type: string, example: "06/04/2026" }
      responses:
        "200":
          description: Flooding points returned (may be empty if CGESP has no data or circuit is open)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FloodData"
        "400":
          description: Invalid date format (expected DD/MM/YYYY)

  /api/floodings/range:
    get:
      tags: [Floodings]
      summary: Flooding points for a date range
      description: |
        Returns all flooding points scraped from CGESP for every date in the
        inclusive range **[from, to]**. Dates are queried sequentially.

        Maximum allowed range is configured via `cgesp.max-range-days`
        (default **30 days**). Requests exceeding this return `400`.

        **Circuit breaker / retry:** same resilience policy as the single-date
        endpoint applies per date; failed dates return an empty contribution.
      operationId: getFloodingsByRange
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: from
          in: query
          required: true
          description: "Start date (inclusive) in DD/MM/YYYY format"
          schema: { type: string, example: "01/04/2026" }
        - name: to
          in: query
          required: true
          description: "End date (inclusive) in DD/MM/YYYY format"
          schema: { type: string, example: "06/04/2026" }
      responses:
        "200":
          description: Flat list of flooding points across all queried dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FloodData"
        "400":
          description: |
            Bad request — possible causes:
            - Invalid date format (expected DD/MM/YYYY)
            - `from` is after `to`
            - Range exceeds `cgesp.max-range-days` (default 30)

  /api/floodings/poll:
    post:
      tags: [Floodings]
      summary: Trigger manual CGESP poll
      description: |
        Immediately fetches today's flooding points from CGESP and publishes
        them to Event Hub via gRPC.
      operationId: manualPollFloodings
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "202":
          description: Poll accepted and initiated
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/FloodingPollAck"

  /api/floodings/health:
    get:
      tags: [Floodings]
      summary: Flooding service health
      operationId: floodingHealth
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/FloodingHealthStatus"

  # ---------------------------------------------------------------------------
  # Buses
  # ---------------------------------------------------------------------------

  /api/buses/lines:
    get:
      tags: [Buses]
      summary: Search bus lines
      description: |
        Searches the OlhoVivo API for bus lines matching the given term
        (line number or name). Returns all matching lines across all directions.
        The `cl` field in each result is the line code used for position queries.
      operationId: searchLines
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: q
          in: query
          required: true
          description: "Line number or partial name (e.g. '8000', 'Lapa')"
          schema: { type: string }
      responses:
        "200":
          description: Matching lines returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineData"

  /api/buses/positions/line:
    get:
      tags: [Buses]
      summary: Vehicle positions for a line
      description: |
        Returns the current GPS position of all vehicles operating on the
        given line code (`cl`). Obtain `cl` from the `/lines` endpoint.
      operationId: positionsByLine
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: codigoLinha
          in: query
          required: true
          description: Line code (cl) obtained from /api/buses/lines
          schema: { type: integer }
      responses:
        "200":
          description: Vehicle positions returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionResponse"

  /api/buses/poll:
    post:
      tags: [Buses]
      summary: Trigger manual OlhoVivo poll
      description: |
        Runs the full targeted polling workflow immediately:
        1. Searches each configured `line-terms` via /Linha/Buscar
        2. Resolves `cl` codes from results
        3. Fetches positions per line via /Posicao/Linha
        4. Publishes each response to Event Hub via gRPC
      operationId: manualPollBuses
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "202":
          description: Poll accepted and initiated
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/BusPollAck"

  /api/buses/health:
    get:
      tags: [Buses]
      summary: Bus service health
      operationId: busHealth
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/BusHealthStatus"

# --------------------------------------------------------------------------- #
# Schemas                                                                      #
# --------------------------------------------------------------------------- #

components:

  parameters:
    ApiVersion:
      name: X-API-Version
      in: header
      required: false
      description: |
        API version to use. Defaults to `1.0` when omitted.
        Supported values: `1.0`
      schema:
        type: string
        default: "1.0"
        enum: ["1.0"]

  schemas:

    VesselPollAck:
      type: string
      description: Acknowledgement returned by POST /api/vessels/poll when the AIS fetch cycle is accepted
      example: "Polling initiated"

    VesselHealthStatus:
      type: string
      description: Liveness message returned by GET /api/vessels/health
      example: "Vessel service is running"

    BusPollAck:
      type: string
      description: Acknowledgement returned by POST /api/buses/poll when the OlhoVivo polling workflow is accepted
      example: "OlhoVivo polling initiated"

    BusHealthStatus:
      type: string
      description: Liveness message returned by GET /api/buses/health
      example: "OlhoVivo bus service is running"

    VesselData:
      type: object
      description: AIS vessel data record
      properties:
        id:            { type: integer, format: int64 }
        vessel_id:     { type: integer, format: int64 }
        vesselClass:   { type: string }
        imo:           { type: integer, format: int64 }
        mmsi:          { type: integer, format: int64 }
        name:          { type: string }
        name_ais:      { type: string }
        ship_type_id:  { type: integer, format: int64 }
        detailed_type_id: { type: integer, format: int64 }
        timestamp_of_position: { type: integer, format: int64 }
        latitude:      { type: number, format: double }
        longitude:     { type: number, format: double }
        speed_over_ground: { type: number, format: double }
        course_over_ground: { type: number, format: double }
        true_heading:  { type: integer, format: int64 }
        flag:          { type: string }

    LineData:
      type: object
      description: SPTrans bus line
      properties:
        cl: { type: integer, description: "Unique line code (per direction)" }
        lc: { type: boolean, description: "true if the line is circular" }
        lt: { type: string,  description: "Numeric line sign (e.g. '8000')" }
        sl: { type: integer, description: "Direction: 1=main→secondary, 2=secondary→main" }
        tl: { type: integer, description: "Operation mode: 10=BASE, 21/23/32/41=ATENDIMENTO" }
        tp: { type: string,  description: "Sign in main→secondary direction" }
        ts: { type: string,  description: "Sign in secondary→main direction" }

    VehicleData:
      type: object
      description: Located bus vehicle
      properties:
        p:  { type: integer, description: "Vehicle prefix" }
        a:  { type: boolean, description: "Accessible for people with disabilities" }
        ta: { type: string,  description: "UTC timestamp of position capture (ISO 8601)" }
        py: { type: number, format: double, description: "Latitude" }
        px: { type: number, format: double, description: "Longitude" }

    LinePosition:
      type: object
      description: A single line's vehicle data inside a position snapshot
      properties:
        c:   { type: string,  description: "Full line sign (e.g. '5015-10')" }
        cl:  { type: integer, description: "Line code" }
        sl:  { type: integer, description: "Direction" }
        lt0: { type: string,  description: "Destination sign" }
        lt1: { type: string,  description: "Origin sign" }
        qv:  { type: integer, description: "Number of located vehicles" }
        vs:
          type: array
          items: { $ref: "#/components/schemas/VehicleData" }

    PositionResponse:
      type: object
      description: Vehicle position snapshot from OlhoVivo
      properties:
        hr: { type: string, description: "Reference timestamp of the data (HH:mm)" }
        l:
          type: array
          description: Lines with located vehicles (populated by /Posicao)
          items: { $ref: "#/components/schemas/LinePosition" }
        vs:
          type: array
          description: Vehicles directly (populated by /Posicao/Linha)
          items: { $ref: "#/components/schemas/VehicleData" }

    FloodingPollAck:
      type: string
      description: Acknowledgement returned by POST /api/floodings/poll
      example: "CGESP flooding polling initiated"

    FloodingHealthStatus:
      type: string
      description: Liveness message returned by GET /api/floodings/health
      example: "CGESP flooding service is running"

    FloodStatus:
      type: string
      description: |
        CGESP flood classification derived from the CSS class on the HTML page.
        - `ATIVO_INTRANSITAVEL` — active, road impassable
        - `ATIVO_TRANSITAVEL`   — active, road still passable
        - `INATIVO_INTRANSITAVEL` — resolved, was impassable
        - `INATIVO_TRANSITAVEL`   — resolved, was passable
      enum:
        - ATIVO_INTRANSITAVEL
        - ATIVO_TRANSITAVEL
        - INATIVO_INTRANSITAVEL
        - INATIVO_TRANSITAVEL

    FloodData:
      type: object
      description: A single flooding point scraped from the CGESP website
      properties:
        date:
          type: string
          format: date
          description: "Date of the flooding event (YYYY-MM-DD)"
          example: "2026-04-06"
        zone:
          type: string
          description: "São Paulo zone (e.g. 'Zona Leste')"
          example: "Zona Leste"
        neighborhood:
          type: string
          description: "Neighborhood name"
          example: "São Mateus"
        status:
          $ref: "#/components/schemas/FloodStatus"
        startTime:
          type: string
          format: time
          description: "Time the flooding started (HH:MM)"
          example: "17:52"
        endTime:
          type: string
          format: time
          description: |
            Time the flooding ended (HH:MM).
            Inferred to current SP time if still active today,
            or 23:59 for historical records with no end time.
          example: "19:00"
        street:
          type: string
          description: "Street or avenue affected"
          example: "AV JOSE ALENCAR GOMES DA SILVA"
        direction:
          type: string
          description: "Traffic direction affected"
          example: "CENTRO/BAIRRO"
        reference:
          type: string
          description: "Cross-reference landmark"
          example: "AV SAPOPEMBA"
