# Spring Application Configuration
spring:
  application:
    name: live-ms-java

  # Virtual Threads: Enables Project Loom support for lightweight threading (requires Java 21+)
  threads:
    virtual:
      enabled: true

  # API Versioning (Spring Boot 4 native support)
  mvc:
    apiversion:
      default: "1.0"
      supported: "1.0"
      use.header: "X-API-Version"

  config:
    import:
      - "optional:file:.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  sql:
    init:
      mode: always
      schema-locations:
        - classpath:postgresql-schema-migration.sql
        - classpath:schema.sql

  # Spring Cloud Circuit Breaker: Enables Resilience4j integration
  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true

    # OpenFeign Configuration: Declarative REST client settings
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000   # Time in ms to establish connection
            readTimeout: 10000      # Time in ms to wait for data
            loggerLevel: basic      # Log level for Feign requests (basic, full, none)

# Optional legacy producers; disabled for the bus-only deployment.
live:
  sources:
    ais:
      enabled: false
    cgesp:
      enabled: false

# OlhoVivo (SPTrans) Configuration
olhovivo:
  token: ${OLHOVIVO_TOKEN}
  polling:
    interval: 60000  # Poll every 60 seconds
    line-terms:      # key=termosBusca for /Linha/Buscar, value=list of tl filters — buses through Mackenzie "Caio Prado C/B"
      "178L": [10]
      "669A": [10]
      "701A": [10]
      "701U": [10]
      "702C": [10]
      "702U": [10, 22]
      "778R": [10]
      "875A": [10]
      "909T": [1, 10]
      "7267": [10]
      "7272": [10]
      "7281": [10]
      "7282": [10]
      "7411": [10]
      "7545": [10, 21]
      "7903": [10]
      "8700": [1, 10]
      "8705": [10, 51]
      "8707": [10]
      "N801": [11]

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2000ms
        waitDurationInOpenState: 30000ms
    instances:
      olhovivo-api:
        baseConfig: default


# SpringDoc / Swagger UI — uses static openapi.yaml as the spec
springdoc:
  api-docs:
    enabled: false          # Disable auto-generated JSON spec
  swagger-ui:
    url: /openapi.yaml      # Serve the hand-crafted spec from static/
    path: /swagger-ui.html  # UI available at /swagger-ui.html

# Event Hub producers are disabled; data is persisted directly to PostgreSQL.
event-hub:
  enabled: false

# Logging Configuration
logging:
  level:
    root: INFO
    io.github.raphonzius.lvc: DEBUG
    org.springframework.cloud.openfeign: DEBUG
